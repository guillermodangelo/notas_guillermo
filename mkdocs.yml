site_name: Notas Guillermo
site_url: https://guillermodangelo.github.io/notas_guillermo/
repo_url: https://github.com/guillermodangelo/notas_guillermo
repo_name: guillermodangelo/notas_guillermo
edit_uri: edit/main/notes/

docs_dir: notes

theme:
  name: material
  font:
    text: Source Sans 3
    code: Ubuntu Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks.py

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search
  - exclude-search:
      exclude:
        - log.md
  - roamlinks

nav:
  - Home:
    - index.md
    - Embeddings: Embeddings.md
    - Deep Learning: Deep_Learning.md
    - Python: Python.md
    - Data: Data.md
    - Climate Change: Climate_Change.md
    - Urban Planning: Urban_Planning.md
    - Agriculture: Agriculture.md
    - Remote Sensing: Remote_Sensing.md
    - Cartography: Cartography.md
    - Agentic Coding: Agentic_Coding.md
    - Changelog: log.md
